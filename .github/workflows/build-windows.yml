name: Build ThaiChess for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up vcpkg and install SDL2 dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '${{ github.workspace }}/vcpkg.json'
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ThaiChess.exe package/
          Copy-Item build/Release/ThaiChessApp.exe package/
          New-Item -ItemType Directory -Force -Path package/runtime | Out-Null
          $vcpkgBin = Join-Path $env:GITHUB_WORKSPACE 'build/vcpkg_installed/x64-windows/bin'
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }
          Copy-Item (Join-Path $vcpkgBin '*.dll') package/runtime/
          Invoke-WebRequest `
            -Uri 'https://github.com/fairy-stockfish/Fairy-Stockfish/releases/latest/download/fairy-stockfish-largeboard_x86-64.exe' `
            -OutFile 'package/stockfish.exe'
          Copy-Item -Recurse assets package/
          Compress-Archive -Path package/* -DestinationPath ThaiChess-Windows-x64.zip -Force
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiChess-Windows-x64
          path: ThaiChess-Windows-x64.zip
          if-no-files-found: error
      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ThaiChess-Windows-x64.zip
          generate_release_notes: true
